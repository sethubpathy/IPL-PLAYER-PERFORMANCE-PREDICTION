{% extends 'base.html' %}

{% block title %}Page Not Found | IPL ML{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="ipl-card p-5">
            <div class="display-1 fw-bold text-warning mb-3">404</div>
            <h3 class="fw-bold mb-3">Resource Not Found</h3>
            <p class="text-muted mb-4">{{ message or "The page or player you are searching for does not exist." }}</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('index') }}" class="btn btn-ipl-gold">
                    <i class="bi bi-house-door-fill"></i> Back to Dashboard
                </a>
                <a href="{{ url_for('players') }}" class="btn btn-ipl-outline">
                    <i class="bi bi-people-fill"></i> Browse Players
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
